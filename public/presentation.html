    function renderSlide() {
      const slide = slidesData[currentSlide];
      document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} / ${slidesData.length}`;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === slidesData.length - 1;

      document.getElementById('slideContent').innerHTML = `
        <div>
          <span class="inline-block px-3 py-1 rounded-full bg-gray-100 text-gray-600 text-[11px] font-bold">${slide.badge}</span>
          <h2 class="text-2xl font-bold text-gray-900 mt-2">${slide.title}</h2>
          <p class="text-xs text-gray-500 mt-1">${slide.subtitle}</p>
        </div>
        <div>${slide.html}</div>
        <div class="pt-4 border-t border-gray-100 flex items-center justify-between text-[11px] text-gray-400">
          <span>AI人脈コンシェルジュ — 営業提案資料</span>
          <span class="font-mono">${currentSlide + 1} / ${slidesData.length}</span>
        </div>
      `;

      // Render dots
      const dots = slidesData.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-2 rounded-full transition-all ${i === currentSlide ? 'w-6 bg-blue-600' : 'w-2 bg-gray-300 hover:bg-gray-400'}"></button>
      `).join('');
      document.getElementById('dotContainer').innerHTML = dots;
    }

    function prevSlide() {
      if (currentSlide > 0) { currentSlide--; renderSlide(); }
    }
    function nextSlide() {
      if (currentSlide < slidesData.length - 1) { currentSlide++; renderSlide(); }
    }
    function goToSlide(i) {
      currentSlide = i; renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
