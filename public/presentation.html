    let currentDeckType = 'client';
    let currentSlide = 0;

    function getActiveDeck() {
      return currentDeckType === 'client' ? clientDeck : partnerDeck;
    }

    function switchDeck(type) {
      currentDeckType = type;
      currentSlide = 0;

      const clientTab = document.getElementById('clientTab');
      const partnerTab = document.getElementById('partnerTab');

      if (type === 'client') {
        clientTab.className = "px-3 py-1 rounded-lg font-bold bg-white text-blue-600 shadow-sm transition-all";
        partnerTab.className = "px-3 py-1 rounded-lg font-bold text-gray-600 hover:text-gray-900 transition-all";
      } else {
        clientTab.className = "px-3 py-1 rounded-lg font-bold text-gray-600 hover:text-gray-900 transition-all";
        partnerTab.className = "px-3 py-1 rounded-lg font-bold bg-white text-emerald-600 shadow-sm transition-all";
      }
      renderSlide();
    }

    function renderSlide() {
      const deck = getActiveDeck();
      const slide = deck[currentSlide] || deck[0];
      document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} / ${deck.length}`;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === deck.length - 1;

      document.getElementById('slideContent').innerHTML = `
        <div>
          <span class="inline-block px-3 py-1 rounded-full bg-gray-100 text-gray-600 text-[11px] font-bold border border-gray-200">${slide.badge}</span>
          <h2 class="text-2xl font-extrabold text-gray-900 mt-2 tracking-tight">${slide.title}</h2>
          <p class="text-xs text-gray-500 mt-1">${slide.subtitle}</p>
        </div>
        <div>${slide.html}</div>
        <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-[11px] text-gray-400">
          <span>AI人脈コンシェルジュ — ${currentDeckType === 'client' ? 'クライアント営業提案資料' : '協業・アライアンス提案資料'}</span>
          <span class="font-mono font-bold">${currentSlide + 1} / ${deck.length}</span>
        </div>
      `;

      // Render dots
      const dots = deck.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-2 rounded-full transition-all ${i === currentSlide ? (currentDeckType === 'client' ? 'w-6 bg-blue-600' : 'w-6 bg-emerald-600') : 'w-2 bg-gray-300 hover:bg-gray-400'}"></button>
      `).join('');
      document.getElementById('dotContainer').innerHTML = dots;
    }

    function prevSlide() {
      if (currentSlide > 0) { currentSlide--; renderSlide(); }
    }
    function nextSlide() {
      const deck = getActiveDeck();
      if (currentSlide < deck.length - 1) { currentSlide++; renderSlide(); }
    }
    function goToSlide(i) {
      currentSlide = i; renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide();
  </script>
